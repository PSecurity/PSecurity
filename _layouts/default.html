<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="theme-color" content="#7c3aed">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Share+Tech+Mono&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="background-grid" aria-hidden="true"></div>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Voltar para a página inicial">
        <span class="brand__mark">&gt;_</span>
        <span class="brand__text">
          <strong>PeekSecurity</strong>
          <small>by Gilberto Martins</small>
        </span>
      </a>

      <button class="nav-toggle" type="button" aria-label="Abrir menu" data-nav-toggle>Menu</button>

      <nav class="nav" data-nav>
        <a href="{{ '/' | relative_url }}">Início</a>
        <a href="{{ '/projects/' | relative_url }}">Projetos</a>
        <a href="{{ '/about/' | relative_url }}">Sobre</a>
        <a href="{{ '/curriculo/' | relative_url }}">Currículo</a>
        <a href="{{ '/contact/' | relative_url }}">Contato</a>
        <a href="{{ '/category/termux/' | relative_url }}">Termux</a>
        <a href="{{ '/category/kali/' | relative_url }}">Kali</a>
        <a href="{{ '/category/scripts/' | relative_url }}">Scripts</a>
        <a href="{{ '/category/tutoriais/' | relative_url }}">Tutoriais</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p><strong>PeekSecurity</strong> - tecnologia, segurança da informação e ferramentas educacionais para ambientes autorizados.</p>
      <div class="footer-links">
        <a href="https://github.com/PSecurity" target="_blank" rel="noopener">GitHub</a>
        <a href="https://tiktok.com/@PeekSecurity" target="_blank" rel="noopener">TikTok</a>
        <a href="https://www.youtube.com/@PeekSecurity" target="_blank" rel="noopener">YouTube</a>
        <a href="mailto:gilbertoferreirasp@gmail.com">E-mail</a>
      </div>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
